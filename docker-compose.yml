services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ims_app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - ims_net

  db:
    image: mariadb:10.6
    container_name: ims_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ims_db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ims_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ims_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./docker/cloudflared-credentials.json:/etc/cloudflared/cloudflared-credentials.json:ro
    depends_on:
      - app
    networks:
      - ims_net

networks:
  ims_net:
    driver: bridge

volumes:
  ims_db_data:
